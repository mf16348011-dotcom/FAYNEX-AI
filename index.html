<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>FAYNEX AI — Next-Generation Intelligence</title>
  <meta content="FAYNEX AI — Next-Generation Intelligence" name="description"/>
  <link rel="icon" type="image/png" href="faynex-logo.png"/>
  <link rel="apple-touch-icon" href="faynex-logo.png"/>

  <!-- Highlight.js (Code Highlighting) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/atom-one-dark.min.css"/>
  <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>

  <!-- External Libraries -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked@15.0.12/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg: #06070b;
      --panel: #0b0d13;
      --panel-2: #10131b;
      --border: rgba(255, 255, 255, 0.08);
      --border2: rgba(255, 255, 255, 0.14);
      --text: #f5f7fb;
      --muted: #858b9a;
      --accent: #8b5cf6;
      --accent-2: #6366f1;
      --danger: #ef4444;
    }

    body {
      min-height: 100vh;
      background:
        linear-gradient(rgba(4, 5, 12, 0.5), rgba(4, 5, 12, 0.5)),
        url("faynex-background.png") center center / cover fixed no-repeat,
        var(--bg);
      color: var(--text);
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
    }

    button, textarea {
      font: inherit;
    }

    button {
      border: 0;
      cursor: pointer;
    }

    .app {
      height: 100vh;
      display: flex;
      position: relative;
    }

    /* SIDEBAR */
    .sidebar {
      width: 270px;
      height: 100vh;
      background: rgba(8, 10, 15, 0.95);
      border-right: 1px solid var(--border);
      backdrop-filter: blur(20px);
      display: flex;
      flex-direction: column;
      padding: 20px 16px;
      z-index: 40;
      transition: transform 0.3s ease;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 4px 8px 20px;
    }

    .brand-logo {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      display: grid;
      place-items: center;
      box-shadow: 0 0 25px rgba(99, 102, 241, 0.35);
    }

    .brand-logo-image, .avatar-logo-image {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      filter: drop-shadow(0 0 10px rgba(124, 58, 237, 0.5));
    }

    .brand-name {
      font-size: 18px;
      font-weight: 750;
      letter-spacing: 0.5px;
    }

    .brand-subtitle {
      color: var(--muted);
      font-size: 10px;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .new-chat {
      width: 100%;
      padding: 12px 14px;
      border-radius: 12px;
      color: white;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 8px 25px rgba(99, 102, 241, 0.2);
      transition: 0.2s ease;
    }

    .new-chat:hover {
      transform: translateY(-1px);
      box-shadow: 0 10px 30px rgba(99, 102, 241, 0.35);
    }

    .sidebar-section {
      margin-top: 24px;
    }

    .section-title {
      color: #686e7c;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      padding: 0 10px 8px;
    }

    .nav-item {
      width: 100%;
      padding: 10px 12px;
      background: transparent;
      color: #a9aebb;
      border-radius: 10px;
      display: flex;
      align-items: center;
      gap: 11px;
      text-align: left;
      margin-bottom: 3px;
      transition: 0.2s ease;
    }

    .nav-item:hover {
      background: rgba(255, 255, 255, 0.05);
      color: white;
    }

    .recent-list {
      display: flex;
      flex-direction: column;
      gap: 3px;
      max-height: 38vh;
      overflow-y: auto;
      padding-right: 3px;
    }

    .recent-list::-webkit-scrollbar { width: 4px; }
    .recent-list::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.1); border-radius: 20px; }

    .recent-chat {
      display: flex;
      align-items: center;
      gap: 4px;
      border-radius: 8px;
    }

    .recent-chat.active {
      background: rgba(139, 92, 246, 0.12);
    }

    .recent-chat-title {
      flex: 1;
      color: #8f96a5;
      font-size: 12px;
      padding: 8px 10px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      background: transparent;
      text-align: left;
    }

    .recent-chat.active .recent-chat-title { color: #ddd6fe; font-weight: 500; }
    .recent-chat:hover .recent-chat-title { color: white; }

    .recent-chat-actions {
      display: flex;
      gap: 2px;
      opacity: 0;
      transition: opacity .15s ease;
      padding-right: 6px;
    }

    .recent-chat:hover .recent-chat-actions,
    .recent-chat.active .recent-chat-actions { opacity: 1; }

    .recent-mini {
      width: 24px;
      height: 24px;
      border-radius: 6px;
      background: transparent;
      color: #686f7e;
      font-size: 12px;
    }

    .recent-mini:hover { color: white; background: rgba(255,255,255,0.1); }

    .sidebar-bottom {
      margin-top: auto;
      padding-top: 15px;
      border-top: 1px solid var(--border);
    }

    .account-chip {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: rgba(255,255,255,0.03);
      color: #bfc5d1;
      font-size: 11px;
      margin-bottom: 10px;
    }

    .account-avatar {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      object-fit: cover;
    }

    .account-email {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* MAIN */
    .main {
      flex: 1;
      height: 100vh;
      display: flex;
      flex-direction: column;
      min-width: 0;
      position: relative;
    }

    .topbar {
      height: 64px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      background: rgba(6, 7, 11, 0.7);
      backdrop-filter: blur(18px);
      z-index: 10;
    }

    .model-info { display: flex; align-items: center; gap: 10px; }
    .model-orb {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 12px var(--accent);
    }
    .model-name { font-size: 14px; font-weight: 700; }
    .model-state { color: var(--muted); font-size: 11px; }

    .top-actions { display: flex; gap: 6px; }
    .icon-btn {
      width: 36px;
      height: 36px;
      border-radius: 9px;
      background: transparent;
      color: #8e95a4;
      display: grid;
      place-items: center;
      font-size: 15px;
      transition: 0.2s ease;
    }
    .icon-btn:hover { background: rgba(255, 255, 255, 0.08); color: white; }

    /* CHAT AREA */
    .chat-area {
      flex: 1;
      overflow-y: auto;
      scroll-behavior: smooth;
    }
    .chat-area::-webkit-scrollbar { width: 6px; }
    .chat-area::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.1); border-radius: 20px; }

    .welcome {
      min-height: calc(100vh - 220px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 30px 20px;
      text-align: center;
    }
    .welcome-orb {
      width: 130px;
      height: 130px;
      display: grid;
      place-items: center;
      animation: float 4s ease-in-out infinite;
    }
    .welcome-logo-image {
      width: 100%;
      height: 100%;
      object-fit: contain;
      filter: drop-shadow(0 0 30px rgba(124, 58, 237, 0.45));
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-7px); }
    }

    .welcome h1 {
      margin-top: 16px;
      font-size: clamp(28px, 4vw, 44px);
      letter-spacing: -1px;
    }
    .gradient-text {
      background: linear-gradient(90deg, #ffffff, #a78bfa, #818cf8);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .welcome p {
      max-width: 540px;
      margin-top: 10px;
      color: var(--muted);
      line-height: 1.6;
      font-size: 13px;
    }

    .suggestions {
      width: min(720px, 100%);
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-top: 28px;
    }
    .suggestion {
      text-align: left;
      padding: 14px;
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.025);
      color: #b6bbc7;
      border-radius: 12px;
      transition: 0.2s ease;
    }
    .suggestion:hover {
      border-color: rgba(139, 92, 246, 0.4);
      background: rgba(139, 92, 246, 0.08);
      transform: translateY(-1px);
    }
    .suggestion strong { display: block; color: #f0f2f7; font-size: 12px; margin-bottom: 4px; }
    .suggestion span { font-size: 11px; color: #727988; }

    /* MESSAGES */
    .messages {
      width: min(850px, 100%);
      margin: 0 auto;
      padding: 30px 20px 160px;
    }

    .message {
      display: flex;
      gap: 14px;
      margin-bottom: 26px;
      animation: messageIn 0.2s ease;
    }
    @keyframes messageIn {
      from { opacity: 0; transform: translateY(5px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .avatar {
      flex: 0 0 34px;
      width: 34px;
      height: 34px;
      border-radius: 10px;
      display: grid;
      place-items: center;
      font-size: 11px;
      font-weight: 800;
    }
    .avatar.user { background: #222634; color: #e2e6f0; }
    .avatar.ai {
      background: linear-gradient(135deg, #7c3aed, #4f46e5);
      color: white;
    }

    .message-content { min-width: 0; flex: 1; }
    .message-label { font-size: 11px; font-weight: 700; color: #9ca2af; margin-bottom: 6px; }
    .message-text {
      color: #d9dce4;
      font-size: 14.5px;
      line-height: 1.7;
      word-break: break-word;
    }

    /* MARKDOWN & CODE BLOCKS */
    .message-text.markdown p { margin-bottom: 12px; }
    .message-text.markdown p:last-child { margin-bottom: 0; }
    .message-text.markdown h1, .message-text.markdown h2, .message-text.markdown h3 {
      color: #f5f7fa;
      margin: 16px 0 8px;
    }
    .message-text.markdown ul, .message-text.markdown ol { margin: 8px 0 12px 20px; }
    .message-text.markdown blockquote {
      margin: 12px 0;
      padding: 8px 14px;
      border-left: 3px solid var(--accent);
      background: rgba(139, 92, 246, 0.08);
      border-radius: 0 8px 8px 0;
    }
    .message-text.markdown code:not(pre code) {
      padding: 2px 6px;
      border-radius: 5px;
      background: rgba(255, 255, 255, 0.09);
      color: #ddd6fe;
      font-size: 0.9em;
    }

    .code-container {
      margin: 14px 0;
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid var(--border);
      background: #181a1f;
    }
    .code-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 14px;
      background: #21252b;
      font-size: 11px;
      color: #abb2bf;
    }
    .copy-code-btn {
      background: transparent;
      color: #abb2bf;
      font-size: 11px;
      padding: 2px 6px;
      border-radius: 4px;
      transition: 0.2s;
    }
    .copy-code-btn:hover { background: rgba(255, 255, 255, 0.1); color: white; }
    .code-container pre { margin: 0; padding: 12px 14px; overflow-x: auto; font-size: 13px; line-height: 1.5; }

    .message-actions { display: flex; gap: 6px; margin-top: 10px; }
    .message-action {
      padding: 5px 9px;
      border-radius: 7px;
      background: rgba(255, 255, 255, 0.05);
      color: #8b92a2;
      font-size: 11px;
      transition: 0.2s;
    }
    .message-action:hover { background: rgba(255, 255, 255, 0.1); color: white; }
    .message-action.speaking { color: #c4b5fd; background: rgba(139,92,246,0.18); }

    /* COMPOSER */
    .composer-wrap {
      position: absolute;
      left: 270px;
      right: 0;
      bottom: 0;
      padding: 16px 20px 20px;
      background: linear-gradient(to top, rgba(6, 7, 11, 1) 60%, rgba(6, 7, 11, 0));
      z-index: 20;
    }

    .composer {
      width: min(820px, 100%);
      margin: auto;
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: rgba(13, 16, 24, 0.94);
      backdrop-filter: blur(20px);
      border-radius: 16px;
      padding: 10px;
      box-shadow: 0 15px 45px rgba(0, 0, 0, 0.45);
    }

    .composer textarea {
      width: 100%;
      resize: none;
      border: 0;
      outline: 0;
      background: transparent;
      color: white;
      padding: 8px 10px;
      min-height: 42px;
      max-height: 160px;
      font-size: 14.5px;
      line-height: 1.5;
    }
    .composer textarea::placeholder { color: #626978; }

    .composer-bottom {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 4px 6px 0;
    }
    .composer-tools { display: flex; gap: 4px; align-items: center; }

    .tool-btn, .web-search-btn {
      height: 34px;
      border-radius: 8px;
      background: transparent;
      color: #838a99;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0 10px;
      font-size: 12px;
      gap: 6px;
      transition: 0.2s ease;
    }
    .tool-btn:hover, .web-search-btn:hover { background: rgba(255, 255, 255, 0.08); color: white; }
    .web-search-btn.active {
      color: #c4b5fd;
      background: rgba(139, 92, 246, 0.14);
      border: 1px solid rgba(139, 92, 246, 0.3);
    }

    .send-btn {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: white;
      display: grid;
      place-items: center;
      font-size: 15px;
      box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3);
      transition: 0.2s ease;
    }
    .send-btn:hover { transform: scale(1.05); }
    .send-btn.stop-btn { background: rgba(239, 68, 68, 0.2); color: #fca5a5; }

    /* ATTACHMENT PREVIEW */
    .attachment-preview {
      display: none;
      align-items: center;
      gap: 10px;
      padding: 6px 10px;
      margin-bottom: 6px;
      background: rgba(255,255,255,0.04);
      border-radius: 8px;
      border: 1px solid var(--border);
    }
    .attachment-preview.has-file { display: flex; }
    .attachment-thumb { width: 34px; height: 34px; border-radius: 6px; object-fit: cover; }
    .attachment-meta { flex: 1; min-width: 0; font-size: 11px; }
    .attachment-name { color: #f0f3f8; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .attachment-remove { background: transparent; color: #838a99; font-size: 16px; padding: 0 4px; }
    .attachment-remove:hover { color: #ef4444; }

    .disclaimer {
      text-align: center;
      color: #555c6d;
      font-size: 10px;
      margin-top: 8px;
    }

    /* TYPING INDICATOR */
    .typing { display: inline-flex; gap: 4px; align-items: center; min-height: 20px; }
    .typing span {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent);
      animation: typing 1s infinite ease-in-out;
    }
    .typing span:nth-child(2) { animation-delay: .15s; }
    .typing span:nth-child(3) { animation-delay: .30s; }
    @keyframes typing {
      0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
      30% { transform: translateY(-4px); opacity: 1; }
    }

    /* OVERLAYS (MODALS) */
    .modal-overlay {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(10px);
    }
    .modal-overlay.open { display: flex; }
    .modal-panel {
      width: min(600px, 100%);
      max-height: 85vh;
      overflow: hidden;
      border-radius: 18px;
      background: #0f121a;
      border: 1px solid var(--border2);
      box-shadow: 0 25px 80px rgba(0,0,0,0.6);
    }
    .modal-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
    }
    .modal-close {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: rgba(255,255,255,0.06);
      color: #9ba0af;
      font-size: 16px;
    }

    /* TOAST */
    .toast {
      position: fixed;
      left: 50%;
      bottom: 105px;
      transform: translate(-50%, 15px);
      z-index: 200;
      padding: 10px 16px;
      border-radius: 10px;
      background: rgba(18, 22, 33, 0.95);
      border: 1px solid var(--border2);
      color: #f1f3f9;
      font-size: 12px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.5);
      opacity: 0;
      pointer-events: none;
      transition: all 0.2s ease;
    }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }

    /* AUTH OVERLAY */
    .auth-overlay {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: grid;
      place-items: center;
      padding: 20px;
      background: rgba(4, 5, 10, 0.95);
      backdrop-filter: blur(20px);
    }
    .auth-overlay.hidden { display: none; }
    .auth-card {
      width: min(400px, 100%);
      padding: 32px 26px;
      border-radius: 20px;
      background: #0f121a;
      border: 1px solid var(--border2);
      text-align: center;
    }
    .auth-logo { width: 90px; height: 90px; margin: 0 auto 12px; object-fit: contain; }
    .google-login-btn {
      width: 100%;
      min-height: 46px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      border-radius: 10px;
      background: #fff;
      color: #171717;
      font-weight: 600;
      margin-top: 20px;
    }

    /* MOBILE BACKDROP */
    .sidebar-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      z-index: 35;
      backdrop-filter: blur(4px);
    }

    @media (max-width: 800px) {
      .sidebar {
        position: fixed;
        left: 0;
        top: 0;
        transform: translateX(-100%);
      }
      .sidebar.open { transform: translateX(0); }
      .sidebar-backdrop.open { display: block; }
      .composer-wrap { left: 0; padding: 12px; }
      .suggestions { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<!-- AUTH SCREEN -->
<div class="auth-overlay" id="authOverlay">
  <div class="auth-card">
    <img class="auth-logo" src="faynex-logo.png" alt="FAYNEX logo">
    <h2>FAYNEX AI</h2>
    <p style="color:var(--muted);font-size:12px;margin-top:6px;">Next-Generation Intelligence Assistant</p>
    <button class="google-login-btn" id="googleLoginBtn" type="button">
      <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M21.35 12.27c0-.79-.07-1.55-.22-2.27H12v4.3h5.22a4.46 4.46 0 0 1-1.94 2.93v2.43h3.14c1.84-1.69 2.93-4.18 2.93-7.39Z"/><path fill="#34A853" d="M12 21.75c2.64 0 4.86-.87 6.48-2.36l-3.14-2.43c-.87.58-1.98.92-3.34.92-2.56 0-4.73-1.73-5.51-4.05H3.25v2.51A9.79 9.79 0 0 0 12 21.75Z"/><path fill="#FBBC05" d="M6.49 13.83A5.88 5.88 0 0 1 6.18 12c0-.64.11-1.26.31-1.83V7.66H3.25A9.75 9.75 0 0 0 2.25 12c0 1.57.38 3.05 1 4.34l3.24-2.51Z"/><path fill="#EA4335" d="M12 6.12c1.44 0 2.74.5 3.76 1.49l2.82-2.82C16.85 3.21 14.64 2.25 12 2.25a9.79 9.79 0 0 0-8.75 5.41l3.24 2.51C7.27 7.85 9.44 6.12 12 6.12Z"/></svg>
      <span>Continue with Google</span>
    </button>
    <div id="authError" style="color:var(--danger);font-size:11px;margin-top:12px;"></div>
  </div>
</div>

<!-- SIDEBAR BACKDROP FOR MOBILE -->
<div class="sidebar-backdrop" id="sidebarBackdrop"></div>

<div class="app">
  <!-- SIDEBAR -->
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-logo"><img class="brand-logo-image" src="faynex-logo.png" alt="FAYNEX"/></div>
      <div>
        <div class="brand-name">FAYNEX</div>
        <div class="brand-subtitle">AI Intelligence</div>
      </div>
    </div>
    <button class="new-chat" id="newChatBtn">
      <span>＋</span>
      <span>New conversation</span>
    </button>

    <div class="sidebar-section">
      <div class="section-title">Workspace</div>
      <button class="nav-item" id="searchChatsBtn">
        <span>⌕</span>
        <span>Search chats (Ctrl+K)</span>
      </button>
      <button class="nav-item" id="exportChatBtn">
        <span>↓</span>
        <span>Export conversation (.md)</span>
      </button>
    </div>

    <div class="sidebar-section">
      <div class="section-title">Recent</div>
      <div class="recent-list" id="recentList"></div>
    </div>

    <div class="sidebar-bottom">
      <div class="account-chip" id="accountChip" style="display:none;">
        <img class="account-avatar" id="accountAvatar" alt="Avatar">
        <span class="account-email" id="accountEmail"></span>
      </div>
      <button class="nav-item" id="sidebarSettingsBtn">
        <span>⚙</span>
        <span>Memory & Settings</span>
      </button>
      <button class="nav-item" id="logoutBtn" style="color:#ef4444;">
        <span>↪</span>
        <span>Sign out</span>
      </button>
    </div>
  </aside>

  <!-- MAIN CHAT -->
  <main class="main">
    <header class="topbar">
      <div class="model-info">
        <button class="icon-btn" id="menuBtn" style="display:inline-flex;" aria-label="Toggle menu">☰</button>
        <span class="model-orb"></span>
        <div>
          <div class="model-name">FAYNEX 2.0</div>
          <div class="model-state">Ready</div>
        </div>
      </div>
      <div class="top-actions">
        <button class="icon-btn" id="settingsBtn" title="Settings">⚙</button>
      </div>
    </header>

    <section class="chat-area" id="chatArea">
      <div class="welcome" id="welcome">
        <div class="welcome-orb">
          <img class="welcome-logo-image" src="faynex-logo.png" alt="FAYNEX"/>
        </div>
        <h1>Meet <span class="gradient-text">FAYNEX</span></h1>
        <p>A next-generation AI assistant built to help you think, create, write, code and explore.</p>
        <div class="suggestions">
          <button class="suggestion" data-prompt="Give me some creative ideas for an innovative mobile application.">
            <strong>✦ Brainstorming</strong>
            <span>Generate unique project concepts</span>
          </button>
          <button class="suggestion" data-prompt="Write a modern, responsive landing page using HTML and Tailwind CSS.">
            <strong>⌘ Coding Assistant</strong>
            <span>Generate clean web development code</span>
          </button>
        </div>
      </div>
      <div class="messages" id="messages"></div>
    </section>

    <!-- COMPOSER -->
    <div class="composer-wrap">
      <div class="composer">
        <!-- Attachment Preview -->
        <div class="attachment-preview" id="attachmentPreview">
          <img id="attachmentThumb" class="attachment-thumb" style="display:none;" />
          <span id="attachmentDocIcon" style="font-size:20px;display:none;">📄</span>
          <div class="attachment-meta">
            <div class="attachment-name" id="attachmentName">file.pdf</div>
          </div>
          <button class="attachment-remove" id="removeAttachmentBtn" type="button">×</button>
        </div>

        <textarea id="promptInput" placeholder="Ask FAYNEX anything... (Shift+Enter for new line)" rows="1"></textarea>
        <input class="file-input-hidden" id="fileInput" type="file" style="display:none;" accept="image/*,.pdf,.txt,.md,.json,.js,.py,.html,.css" />

        <div class="composer-bottom">
          <div class="composer-tools">
            <button class="tool-btn" id="attachBtn" title="Attach file" type="button">＋</button>
            <button class="tool-btn" id="voiceBtn" title="Voice input" type="button">◉</button>
            <button class="web-search-btn" id="webSearchBtn" type="button">
              <span>🌐</span>
              <span>Web Search</span>
            </button>
          </div>
          <button class="send-btn" id="sendBtn" title="Send message">↑</button>
        </div>
      </div>
      <div class="disclaimer">
        FAYNEX AI can make mistakes. Verify important facts. Developed by MD Fahim.
      </div>
    </div>
  </main>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<!-- SEARCH MODAL -->
<div class="modal-overlay" id="searchOverlay">
  <div class="modal-panel" style="max-width:550px;">
    <div class="modal-head">
      <input id="chatSearchInput" type="search" placeholder="Search conversations..." style="width:100%;border:0;background:transparent;color:white;outline:0;font-size:14px;">
      <button class="modal-close" id="closeSearchBtn">×</button>
    </div>
    <div id="searchResults" style="max-height:350px;overflow-y:auto;padding:10px;"></div>
  </div>
</div>

<script>
  window.addEventListener("DOMContentLoaded", async () => {
    const API_URL = "https://faynex-ai-api.mf16348011.workers.dev";
    const CHATS_KEY = "faynex_chats_v3";
    const ACTIVE_CHAT_KEY = "faynex_active_chat_v3";

    // SUPABASE CONFIG
    const SUPABASE_URL = "https://mbnktonspowrjoabftaq.supabase.co";
    const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_H_9nV1W3O3IZbocXlGNtgg_DjzuXzO9";
    const SUPABASE_REDIRECT_URL = window.location.origin + window.location.pathname;

    let supabaseClient = null;
    let FAYNEX_USER_ID = "";
    let currentSession = null;
    let webSearchEnabled = false;
    let isGenerating = false;
    let abortController = null;
    let pendingAttachment = null;
    let conversations = [];
    let activeConversationId = null;

    // DOM Elements
    const input = document.getElementById("promptInput");
    const sendBtn = document.getElementById("sendBtn");
    const messages = document.getElementById("messages");
    const welcome = document.getElementById("welcome");
    const chatArea = document.getElementById("chatArea");
    const newChatBtn = document.getElementById("newChatBtn");
    const menuBtn = document.getElementById("menuBtn");
    const sidebar = document.getElementById("sidebar");
    const sidebarBackdrop = document.getElementById("sidebarBackdrop");
    const fileInput = document.getElementById("fileInput");
    const attachBtn = document.getElementById("attachBtn");
    const webSearchBtn = document.getElementById("webSearchBtn");
    const toast = document.getElementById("toast");
    const exportChatBtn = document.getElementById("exportChatBtn");

    // Marked options setup
    if (window.marked) {
      window.marked.setOptions({
        gfm: true,
        breaks: true,
        highlight: function(code, lang) {
          const language = window.hljs.getLanguage(lang) ? lang : 'plaintext';
          return window.hljs.highlight(code, { language }).value;
        }
      });
    }

    function showToast(msg, duration = 2500) {
      toast.textContent = msg;
      toast.classList.add("show");
      clearTimeout(showToast.timer);
      showToast.timer = setTimeout(() => toast.classList.remove("show"), duration);
    }

    // Markdown Parser & Sanitizer with Code Card wrapper
    function renderMarkdown(text) {
      let raw = window.marked ? window.marked.parse(text) : text;
      if (window.DOMPurify) raw = window.DOMPurify.sanitize(raw);

      // Wrap code blocks with modern header and copy button
      const temp = document.createElement("div");
      temp.innerHTML = raw;
      temp.querySelectorAll("pre").forEach(pre => {
        const codeEl = pre.querySelector("code");
        const langMatch = (codeEl?.className || "").match(/language-([a-zA-Z0-9]+)/);
        const lang = langMatch ? langMatch[1] : "Code";

        const container = document.createElement("div");
        container.className = "code-container";
        container.innerHTML = `
          <div class="code-header">
            <span>${lang}</span>
            <button class="copy-code-btn" type="button">Copy code</button>
          </div>
        `;
        pre.parentNode.insertBefore(container, pre);
        container.appendChild(pre);

        container.querySelector(".copy-code-btn").addEventListener("click", async (e) => {
          await navigator.clipboard.writeText(codeEl.innerText || "");
          e.target.textContent = "Copied!";
          setTimeout(() => e.target.textContent = "Copy code", 1500);
        });
      });

      return temp.innerHTML;
    }

    // Supabase Auth Initializer
    if (window.supabase) {
      supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

      document.getElementById("googleLoginBtn").addEventListener("click", async () => {
        await supabaseClient.auth.signInWithOAuth({
          provider: "google",
          options: { redirectTo: SUPABASE_REDIRECT_URL }
        });
      });

      document.getElementById("logoutBtn").addEventListener("click", async () => {
        await supabaseClient.auth.signOut();
        window.location.reload();
      });

      const { data } = await supabaseClient.auth.getSession();
      if (data?.session) {
        currentSession = data.session;
        FAYNEX_USER_ID = data.session.user.id;
        document.getElementById("authOverlay").classList.add("hidden");
        document.getElementById("accountChip").style.display = "flex";
        document.getElementById("accountEmail").textContent = data.session.user.email || "Account";
        if (data.session.user.user_metadata?.avatar_url) {
          document.getElementById("accountAvatar").src = data.session.user.user_metadata.avatar_url;
        }
      }
    }

    // Smart Scroll: Only scroll if the user is near bottom
    function smartScrollBottom() {
      const threshold = 140;
      const isNearBottom = chatArea.scrollHeight - chatArea.scrollTop - chatArea.clientHeight < threshold;
      if (isNearBottom) {
        chatArea.scrollTop = chatArea.scrollHeight;
      }
    }

    function addMessage(role, text) {
      welcome.style.display = "none";
      const msg = document.createElement("div");
      msg.className = "message";

      const avatar = document.createElement("div");
      avatar.className = `avatar ${role === "user" ? "user" : "ai"}`;
      avatar.textContent = role === "user" ? "YOU" : "FX";

      const content = document.createElement("div");
      content.className = "message-content";

      const label = document.createElement("div");
      label.className = "message-label";
      label.textContent = role === "user" ? "You" : "FAYNEX";

      const textEl = document.createElement("div");
      textEl.className = "message-text markdown";
      textEl.innerHTML = role === "assistant" ? renderMarkdown(text) : text;

      content.appendChild(label);
      content.appendChild(textEl);
      msg.appendChild(avatar);
      msg.appendChild(content);
      messages.appendChild(msg);

      smartScrollBottom();
      return textEl;
    }

    // Attachment Handler
    attachBtn.addEventListener("click", () => fileInput.click());
    fileInput.addEventListener("change", (e) => {
      const file = e.target.files?.[0];
      if (!file) return;

      const reader = new FileReader();
      const isImg = file.type.startsWith("image/");

      reader.onload = () => {
        pendingAttachment = {
          name: file.name,
          mimeType: file.type,
          data: reader.result.split(",")[1],
          isImage: isImg,
          url: reader.result
        };

        const preview = document.getElementById("attachmentPreview");
        const thumb = document.getElementById("attachmentThumb");
        const docIcon = document.getElementById("attachmentDocIcon");
        document.getElementById("attachmentName").textContent = file.name;

        if (isImg) {
          thumb.src = reader.result;
          thumb.style.display = "block";
          docIcon.style.display = "none";
        } else {
          thumb.style.display = "none";
          docIcon.style.display = "block";
        }
        preview.classList.add("has-file");
      };
      reader.readAsDataURL(file);
    });

    document.getElementById("removeAttachmentBtn").addEventListener("click", () => {
      pendingAttachment = null;
      fileInput.value = "";
      document.getElementById("attachmentPreview").classList.remove("has-file");
    });

    // Send Message Logic
    async function sendMessage() {
      const query = input.value.trim();
      if (!query && !pendingAttachment) return;
      if (isGenerating) {
        if (abortController) abortController.abort();
        isGenerating = false;
        sendBtn.classList.remove("stop-btn");
        sendBtn.textContent = "↑";
        return;
      }

      const activeChat = conversations.find(c => c.id === activeConversationId);
      if (!activeChat) return;

      const userText = query;
      input.value = "";
      input.style.height = "auto";

      addMessage("user", userText);
      activeChat.messages.push({ role: "user", content: userText });

      const aiTextEl = addMessage("assistant", "");
      aiTextEl.innerHTML = `<div class="typing"><span></span><span></span><span></span></div>`;

      isGenerating = true;
      sendBtn.classList.add("stop-btn");
      sendBtn.textContent = "■";

      abortController = new AbortController();

      try {
        const response = await fetch(API_URL, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": `Bearer ${currentSession?.access_token || ""}`
          },
          body: JSON.stringify({
            userId: FAYNEX_USER_ID,
            message: userText,
            history: activeChat.messages.slice(-15),
            webSearch: webSearchEnabled,
            attachment: pendingAttachment ? {
              name: pendingAttachment.name,
              mimeType: pendingAttachment.mimeType,
              data: pendingAttachment.data
            } : null
          }),
          signal: abortController.signal
        });

        if (!response.ok) throw new Error("Could not connect to AI server.");

        // Clear attachment after sending
        pendingAttachment = null;
        document.getElementById("attachmentPreview").classList.remove("has-file");

        const reader = response.body.getReader();
        const decoder = new TextDecoder("utf-8");
        let accumulated = "";

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;

          const chunk = decoder.decode(value, { stream: true });
          const lines = chunk.split("\n");

          for (const line of lines) {
            if (line.startsWith("data:")) {
              const dataStr = line.slice(5).trim();
              if (dataStr === "[DONE]") continue;
              try {
                const parsed = JSON.parse(dataStr);
                const part = parsed?.candidates?.[0]?.content?.parts?.[0]?.text || "";
                accumulated += part;
                aiTextEl.innerHTML = renderMarkdown(accumulated);
                smartScrollBottom();
              } catch {}
            }
          }
        }

        activeChat.messages.push({ role: "assistant", content: accumulated });
        saveChats();
      } catch (err) {
        if (err.name !== "AbortError") {
          aiTextEl.textContent = "An error occurred: " + err.message;
        }
      } finally {
        isGenerating = false;
        sendBtn.classList.remove("stop-btn");
        sendBtn.textContent = "↑";
        smartScrollBottom();
      }
    }

    // Export current conversation to Markdown
    exportChatBtn.addEventListener("click", () => {
      const activeChat = conversations.find(c => c.id === activeConversationId);
      if (!activeChat || !activeChat.messages.length) {
        showToast("No messages to export.");
        return;
      }
      let mdContent = `# ${activeChat.title || "Conversation"}\n\n`;
      activeChat.messages.forEach(m => {
        mdContent += `### ${m.role === "user" ? "You" : "FAYNEX AI"}:\n${m.content}\n\n---\n\n`;
      });
      const blob = new Blob([mdContent], { type: "text/markdown" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = `faynex-chat-${Date.now()}.md`;
      a.click();
      showToast("Conversation downloaded!");
    });

    // Auto-resizing textarea & Shift+Enter support
    input.addEventListener("input", () => {
      input.style.height = "auto";
      input.style.height = Math.min(input.scrollHeight, 160) + "px";
    });

    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    sendBtn.addEventListener("click", sendMessage);

    // Web Search Toggle
    webSearchBtn.addEventListener("click", () => {
      webSearchEnabled = !webSearchEnabled;
      webSearchBtn.classList.toggle("active", webSearchEnabled);
      showToast(webSearchEnabled ? "Web Search enabled" : "Web Search disabled");
    });

    // Mobile Sidebar Toggling & Backdrop
    menuBtn.addEventListener("click", () => {
      sidebar.classList.toggle("open");
      sidebarBackdrop.classList.toggle("open");
    });

    sidebarBackdrop.addEventListener("click", () => {
      sidebar.classList.remove("open");
      sidebarBackdrop.classList.remove("open");
    });

    // LocalStorage Chat Management
    function saveChats() {
      localStorage.setItem(CHATS_KEY, JSON.stringify(conversations));
      localStorage.setItem(ACTIVE_CHAT_KEY, activeConversationId);
      renderRecent();
    }

    function renderRecent() {
      const list = document.getElementById("recentList");
      list.innerHTML = "";
      conversations.forEach(c => {
        const row = document.createElement("div");
        row.className = `recent-chat ${c.id === activeConversationId ? "active" : ""}`;
        row.innerHTML = `
          <button class="recent-chat-title">${c.title || "Conversation"}</button>
          <div class="recent-chat-actions">
            <button class="recent-mini delete-chat" title="Delete">×</button>
          </div>
        `;
        row.querySelector(".recent-chat-title").addEventListener("click", () => {
          activeConversationId = c.id;
          saveChats();
          loadActiveMessages();
          if (window.innerWidth <= 800) {
            sidebar.classList.remove("open");
            sidebarBackdrop.classList.remove("open");
          }
        });
        row.querySelector(".delete-chat").addEventListener("click", (e) => {
          e.stopPropagation();
          conversations = conversations.filter(chat => chat.id !== c.id);
          if (activeConversationId === c.id) {
            activeConversationId = conversations[0]?.id || null;
          }
          saveChats();
          loadActiveMessages();
        });
        list.appendChild(row);
      });
    }

    function loadActiveMessages() {
      messages.innerHTML = "";
      const current = conversations.find(c => c.id === activeConversationId);
      if (!current || !current.messages.length) {
        welcome.style.display = "flex";
        return;
      }
      welcome.style.display = "none";
      current.messages.forEach(m => addMessage(m.role, m.content));
    }

    newChatBtn.addEventListener("click", () => {
      const newChat = { id: "chat_" + Date.now(), title: "New conversation", messages: [] };
      conversations.unshift(newChat);
      activeConversationId = newChat.id;
      saveChats();
      loadActiveMessages();
    });

    // Initialization
    try {
      conversations = JSON.parse(localStorage.getItem(CHATS_KEY)) || [];
      activeConversationId = localStorage.getItem(ACTIVE_CHAT_KEY);
    } catch {}

    if (!conversations.length) {
      const firstChat = { id: "chat_" + Date.now(), title: "New conversation", messages: [] };
      conversations.push(firstChat);
      activeConversationId = firstChat.id;
    }

    renderRecent();
    loadActiveMessages();
  });
</script>
</body>
</html>
